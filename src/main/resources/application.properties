spring.application.name=Inventa
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=${INVENTA_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${INVENTA_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.port=${PORT:8006}
server.error.include-message=${INVENTA_ERROR_INCLUDE_MESSAGE:never}
inventa.firebase.project-id=${FIREBASE_PROJECT_ID:}
inventa.bootstrap.director.username=${INVENTA_DIRECTOR_USERNAME:}
inventa.bootstrap.director.password=${INVENTA_DIRECTOR_PASSWORD:}
inventa.bootstrap.assistant.username=${INVENTA_ASSISTANT_USERNAME:}
inventa.bootstrap.assistant.password=${INVENTA_ASSISTANT_PASSWORD:}
inventa.bootstrap.field-manager.username=${INVENTA_FIELD_MANAGER_USERNAME:}
inventa.bootstrap.field-manager.password=${INVENTA_FIELD_MANAGER_PASSWORD:}
